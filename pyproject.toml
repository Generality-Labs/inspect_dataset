[project]
name = "inspect-dataset"
version = "0.4.0"
description = "Dataset quality scanner for AI evaluation datasets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Matt Fisher", email = "m@ttfisher.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "click>=8.4.2",
    "python-dotenv>=1.0",
    "rich>=15.0.0",
    "datasets>=5.0.1",
    "openai>=2.53.0",
]

[project.scripts]
inspect-dataset = "inspect_dataset.cli:cli"

[project.urls]
# The GitHub repo slug is inspect_dataset (underscore), unlike the kebab-case
# project name — keep these pointing at the real repo when copier updates.
Homepage = "https://github.com/Generality-Labs/inspect_dataset"
Repository = "https://github.com/Generality-Labs/inspect_dataset"
Issues = "https://github.com/Generality-Labs/inspect_dataset/issues"

[project.optional-dependencies]
inspect = [
    "inspect-ai>=0.3.252",
    "openai>=2.53.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The viewer frontend ships only as its built bundle (_view/www/dist);
# node_modules must never reach the sdist or wheel.
source-exclude = ["**/node_modules/**"]
wheel-exclude = ["**/node_modules/**"]

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "D",     # pydocstyle
    "C4",    # flake8-comprehensions
    "PT",    # flake8-pytest-style
    "PIE",   # flake8-pie
    "DTZ",   # flake8-datetimez (timezone-aware datetimes)
    "ISC",   # implicit-str-concat (catches missing commas)
    "ASYNC", # flake8-async
    "N",     # pep8-naming
    "FURB",  # refurb (modernization)
    "RUF",   # ruff-specific rules
    "PLE",   # pylint errors
    "PLW",   # pylint warnings
]
ignore = [
    # E501 stays ON (template deviation): ruff-format wraps code but never
    # splits string literals or comments, so long help texts and messages
    # sail past the limit unchecked without it.
    "D10",    # missing docstrings — don't force them
    "D415",   # first-line punctuation — the module docstring is the project
    # description, whose punctuation varies
    "ISC001", # single-line implicit concat — conflicts with the formatter
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"] # tests don't need docstring linting

[tool.basedpyright]
pythonVersion = "3.12"
# "strict" (pyright's), not basedpyright's stricter default "recommended" —
# the based-only rules (reportAny etc.) are opt-in per project.
typeCheckingMode = "strict"
reportMissingTypeStubs = false # third-party libs are often untyped
# Parity with the previous mypy config (`ignore_missing_imports = true`):
# untyped third-party returns propagate as Unknown, which strict mode then
# reports at every use site (187 findings at switch time). Tightening these
# is follow-up work, deliberately not bundled into the template migration.
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
# The scanner registry resolves each module's `_make_scanner` factory
# dynamically, so pyright sees the functions as unused and their cross-module
# imports as private access. That convention predates the type-checker switch.
reportPrivateUsage = false
reportUnusedFunction = false
# Runtime isinstance checks on JSON-shaped data are deliberate defensive
# narrowing, even where the declared type makes them look redundant.
reportUnnecessaryIsInstance = false

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "inspect-evals>=0.16.0",
    "playwright>=1.62.0",
    "pre-commit>=4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-playwright>=0.8.0",
    "ruff>=0.16.2",
    "watchfiles>=0.21",
    "basedpyright>=1.39",
]
