[project]
name = "inspect-dataset"
dynamic = ["version"]
description = "Dataset quality scanner for AI evaluation datasets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Matt Fisher", email = "m@ttfisher.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "click>=8.4.2",
    "python-dotenv>=1.0",
    "rich>=15.0.0",
    "datasets>=5.0.1",
    "openai>=2.53.0",
]

[project.scripts]
inspect-dataset = "inspect_dataset.cli:cli"

[project.urls]
# The GitHub repo slug is inspect_dataset (underscore), unlike the kebab-case
# project name — keep these pointing at the real repo when copier updates.
Homepage = "https://github.com/Generality-Labs/inspect_dataset"
Repository = "https://github.com/Generality-Labs/inspect_dataset"
Issues = "https://github.com/Generality-Labs/inspect_dataset/issues"

[project.optional-dependencies]
inspect = [
    "inspect-ai>=0.3.252",
    "openai>=2.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# hatchling rather than uv_build: uv_build needs a static version, and the
# version's single source is __version__ in src/inspect_dataset/__init__.py.
[tool.hatch.version]
path = "src/inspect_dataset/__init__.py"

[tool.hatch.build]
# The viewer frontend ships only as its built bundle (_view/www/dist);
# node_modules must never reach the sdist or wheel.
exclude = ["**/node_modules"]

[tool.hatch.build.targets.wheel]
packages = ["src/inspect_dataset"]

[tool.hatch.build.targets.sdist]
only-include = ["src/inspect_dataset", "README.md", "LICENSE"]

[tool.uv]
# uv rebuilds the editable install only when a cache key changes. The version
# lives in __init__.py, so it must be a key too, or a version bump leaves the
# installed metadata (and scan_summary.json's version) on the old value.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/inspect_dataset/__init__.py" }]

[tool.scriv]
# One fragment per pull request in changelog.d/, collected into CHANGELOG.md
# at release time, so concurrent PRs never edit the same lines of the changelog.
format = "md"
fragment_directory = "changelog.d"
categories = ["Added", "Changed", "Deprecated", "Removed", "Fixed", "Security"]
skip_fragments = "[A-Z]*" # TEMPLATE.md
new_fragment_template = "file: TEMPLATE.md"
entry_title_template = "[{{ version }}] - {{ date.strftime('%Y-%m-%d') }}"
md_header_level = "2"
md_html_anchors = false
# Without this, two fragments in one category leave a blank line between them,
# which makes the list loose and fails mdformat on the release commit.
compact_fragments = true
version = "literal: src/inspect_dataset/__init__.py: __version__"

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "D",     # pydocstyle
    "C4",    # flake8-comprehensions
    "PT",    # flake8-pytest-style
    "PIE",   # flake8-pie
    "DTZ",   # flake8-datetimez (timezone-aware datetimes)
    "ISC",   # implicit-str-concat (catches missing commas)
    "ASYNC", # flake8-async
    "N",     # pep8-naming
    "FURB",  # refurb (modernization)
    "RUF",   # ruff-specific rules
    "PLE",   # pylint errors
    "PLW",   # pylint warnings
]
ignore = [
    # E501 stays ON (template deviation): ruff-format wraps code but never
    # splits string literals or comments, so long help texts and messages
    # sail past the limit unchecked without it.
    "D10",    # missing docstrings — don't force them
    "D415",   # first-line punctuation — the module docstring is the project
    # description, whose punctuation varies
    "ISC001", # single-line implicit concat — conflicts with the formatter
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"] # tests don't need docstring linting

[tool.basedpyright]
pythonVersion = "3.12"
# "strict" (pyright's), not basedpyright's stricter default "recommended" —
# the based-only rules (reportAny etc.) are opt-in per project.
typeCheckingMode = "strict"
reportMissingTypeStubs = false # third-party libs are often untyped
# Parity with the previous mypy config (`ignore_missing_imports = true`):
# untyped third-party returns propagate as Unknown, which strict mode then
# reports at every use site (187 findings at switch time). Tightening these
# is follow-up work, deliberately not bundled into the template migration.
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
# The scanner registry resolves each module's `_make_scanner` factory
# dynamically, so pyright sees the functions as unused and their cross-module
# imports as private access. That convention predates the type-checker switch.
reportPrivateUsage = false
reportUnusedFunction = false
# Runtime isinstance checks on JSON-shaped data are deliberate defensive
# narrowing, even where the declared type makes them look redundant.
reportUnnecessaryIsInstance = false

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "inspect-evals>=0.16.0",
    "playwright>=1.62.0",
    "pre-commit>=4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-playwright>=0.8.0",
    "ruff>=0.16.2",
    "scriv>=1.8",
    "watchfiles>=0.21",
    "basedpyright>=1.39",
]
