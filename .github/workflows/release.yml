name: Release

# Publishes to PyPI via trusted publishing (OIDC) when a version tag is pushed.
# One-time PyPI setup: add a Trusted Publisher for this repository
# (owner: Generality-Labs, repository: inspect_dataset, workflow: release.yml,
# environment: pypi) at https://pypi.org/manage/account/publishing/.
#
# Release flow:
#   1. in a release PR: set __version__ in src/inspect_dataset/__init__.py
#      (pyproject.toml reads it) and run `uv run scriv collect`
#   2. after it merges: git tag vX.Y.Z && git push origin vX.Y.Z

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# One release at a time; never cancel a publish in flight.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # OIDC token for PyPI trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # No cache restore in the publish job — a poisoned cache could
          # tamper with what gets uploaded to PyPI (zizmor: cache-poisoning).
          enable-cache: false

      - name: Build sdist and wheel
        run: uv build

      # Checks the version of the wheel about to be uploaded. The version is
      # dynamic (read from __init__.py), which `uv version` cannot report.
      - name: Check tag matches package version
        run: |
          shopt -s nullglob
          wheels=(dist/inspect_dataset-*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "Expected one wheel in dist/, found ${#wheels[@]}" >&2
            exit 1
          fi
          pkg_version=$(basename "${wheels[0]}" | cut -d- -f2)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $pkg_version" >&2
            exit 1
          fi

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
